services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pied-lms-cloudflare-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
      - prod
      - full-stack
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    volumes:
      - pied-lms-cloudflare-config:/etc/cloudflared
    networks:
      - pied-lms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=cloudflare-tunnel"
      - "com.piedteam.description=Cloudflare tunnel for secure external access"
      - "com.piedteam.version=${TAG:-latest}"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"

  lms-postgres:
    image: postgres:16-alpine
    container_name: pied-lms-postgres
    restart: unless-stopped
    profiles:
      - database
      - prod
      - full-stack
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-piedlms}
      POSTGRES_USER: ${DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
    volumes:
      - pied-lms-postgres-data:/var/lib/postgresql/data
    networks:
      - pied-lms-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=postgres-database"
      - "com.piedteam.description=PostgreSQL database for PIED LMS"
      - "com.piedteam.version=16-alpine"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"
      - "com.piedteam.backup.enabled=true"
      - "com.piedteam.backup.schedule=daily"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER:-postgres} -d ${DATABASE__NAME:-piedlms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  lms-backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
      args:
        ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
        BUILDKIT_INLINE_CACHE: 1
    image: ${REGISTRY}/backend:${TAG:-latest}
    container_name: pied-lms-api
    restart: unless-stopped
    profiles:
      - backend
      - prod
      - full-stack
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=lms-postgres;Port=5432;Database=${DATABASE__NAME};Username=${DATABASE__USER};Password=${DATABASE__PASSWORD}"
      DATABASE__HOST: lms-postgres
      DATABASE__PORT: 5432
      DATABASE__NAME: ${DATABASE__NAME}
      DATABASE__USER: ${DATABASE__USER}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    depends_on:
      lms-postgres:
        condition: service_healthy
    networks:
      - pied-lms-network
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=api-backend"
      - "com.piedteam.description=ASP.NET Core API for PIED LMS"
      - "com.piedteam.version=${TAG:-latest}"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"
      - "com.piedteam.port.internal=8080"
      - "com.piedteam.port.external=${API_PORT:-5000}"
      - "com.piedteam.healthcheck.endpoint=/health"
      - "com.piedteam.framework=dotnet"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  pied-lms-postgres-data:
    name: pied-lms-postgres-data
    driver: local
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=postgres-data"
      - "com.piedteam.description=PostgreSQL data volume"
      - "com.piedteam.backup.required=true"
  pied-lms-cloudflare-config:
    name: pied-lms-cloudflare-config
    driver: local
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=cloudflare-config"
      - "com.piedteam.description=Cloudflare tunnel configuration"

networks:
  pied-lms-network:
    name: pied-lms-network
    driver: bridge
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=internal-network"
      - "com.piedteam.description=Internal network for PIED LMS services"