services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pied-lms-cloudflare-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
      - prod
      - full-stack
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    volumes:
      - pied-lms-cloudflare-config:/etc/cloudflared
    networks:
      - pied-lms-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=cloudflare-tunnel"
      - "com.piedteam.description=Cloudflare tunnel for secure external access"
      - "com.piedteam.version=${TAG:-latest}"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"

  lms-postgres:
    image: postgres:16-alpine
    container_name: pied-lms-postgres
    restart: unless-stopped
    profiles:
      - database
      - prod
      - full-stack
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-piedlms}
      POSTGRES_USER: ${DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}
    volumes:
      - pied-lms-postgres-data:/var/lib/postgresql/data
    networks:
      - pied-lms-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=postgres-database"
      - "com.piedteam.description=PostgreSQL database for PIED LMS"
      - "com.piedteam.version=16-alpine"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"
      - "com.piedteam.backup.enabled=true"
      - "com.piedteam.backup.schedule=daily"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE__USER:-postgres} -d ${DATABASE__NAME:-piedlms}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  lms-backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
      args:
        ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
        BUILDKIT_INLINE_CACHE: 1
    image: ${REGISTRY}/backend:${TAG:-latest}
    container_name: pied-lms-api
    restart: unless-stopped
    profiles:
      - backend
      - prod
      - full-stack
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=lms-postgres;Port=5432;Database=${DATABASE__NAME};Username=${DATABASE__USER};Password=${DATABASE__PASSWORD}"
      DATABASE__HOST: lms-postgres
      DATABASE__PORT: 5432
      DATABASE__NAME: ${DATABASE__NAME}
      DATABASE__USER: ${DATABASE__USER}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD}
      Logging__LogLevel__Default: ${LOGGING__LOGLEVEL__DEFAULT:-Information}
      Logging__LogLevel__Microsoft.AspNetCore: ${LOGGING__LOGLEVEL__MICROSOFTASPNETCORE:-Warning}
      JwtSettings__Issuer: ${JWT__ISSUER:-https://localhost:7001}
      JwtSettings__Audience: ${JWT__AUDIENCE:-https://localhost:7001}
      JwtSettings__Secret: ${JWT__SECRET}
      JwtSettings__ExpiryMinutes: ${JWT__EXPIRY_MINUTES:-60}
      JwtSettings__RefreshTokenExpirationDays: ${JWT__REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      EmailSettings__Host: ${EMAIL__HOST:-smtp.gmail.com}
      EmailSettings__Port: ${EMAIL__PORT:-587}
      EmailSettings__SenderEmail: ${EMAIL__SENDER_EMAIL}
      EmailSettings__SenderPassword: ${EMAIL__SENDER_PASSWORD}
      Seed__AdminPassword: ${SEED__ADMIN_PASSWORD}
      Seed__TeacherPassword: ${SEED__TEACHER_PASSWORD}
      Seed__MentorPassword: ${SEED__MENTOR_PASSWORD}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      CompilerOptions__Enabled: ${COMPILER__ENABLED:-true}
      CompilerOptions__ContainerPoolSize: ${COMPILER__CONTAINER_POOL_SIZE:-3}
      CompilerOptions__MaxConcurrentCompilations: ${COMPILER__MAX_CONCURRENT_COMPILATIONS:-3}
      CompilerOptions__MaxConcurrentTestCases: ${COMPILER__MAX_CONCURRENT_TEST_CASES:-8}
      CompilerOptions__SemaphoreWaitTimeoutMs: ${COMPILER__SEMAPHORE_WAIT_TIMEOUT_MS:-2000}
      CompilerOptions__ContainerNamePrefix: ${COMPILER__CONTAINER_NAME_PREFIX:-compiler-}
      CompilerOptions__ContainerImage: ${COMPILER__CONTAINER_IMAGE:-gcc:13}
      CompilerOptions__ContainerWorkDir: ${COMPILER__CONTAINER_WORK_DIR:-/dev/shm/pied-judge}
      CompilerOptions__ContainerNetwork: ${COMPILER__CONTAINER_NETWORK:-none}
      CompilerOptions__ContainerCpuLimit: ${COMPILER__CONTAINER_CPU_LIMIT:-0.5}
      CompilerOptions__ContainerMemoryLimitMb: ${COMPILER__CONTAINER_MEMORY_LIMIT_MB:-256}
      CompilerOptions__ContainerMemorySwapMb: ${COMPILER__CONTAINER_MEMORY_SWAP_MB:-256}
      CompilerOptions__ContainerPidsLimit: ${COMPILER__CONTAINER_PIDS_LIMIT:-64}
      CompilerOptions__ContainerReadOnlyRootFs: ${COMPILER__CONTAINER_READONLY_ROOTFS:-true}
      CompilerOptions__ContainerTmpfsMount: ${COMPILER__CONTAINER_TMPFS_MOUNT:-/tmp:rw,size=64m}
      CompilerOptions__DefaultTimeLimitMs: ${COMPILER__DEFAULT_TIME_LIMIT_MS:-5000}
      CompilerOptions__DefaultMemoryLimitMb: ${COMPILER__DEFAULT_MEMORY_LIMIT_MB:-256}
      CompilerOptions__WorkDirCleanupIntervalSeconds: ${COMPILER__WORKDIR_CLEANUP_INTERVAL_SECONDS:-60}
      CompilerOptions__WorkDirMaxAgeMinutes: ${COMPILER__WORKDIR_MAX_AGE_MINUTES:-10}
      CompilerOptions__OutputLimitBytes: ${COMPILER__OUTPUT_LIMIT_BYTES:-1048576}
      CompilerOptions__StderrLimitBytes: ${COMPILER__STDERR_LIMIT_BYTES:-262144}
      CompilerOptions__CompileSuccessMarker: ${COMPILER__COMPILE_SUCCESS_MARKER:-_COMPILE_SUCCESS_}
      CompilerOptions__TestCaseBasePath: ${COMPILER__TEST_CASE_BASE_PATH:-/testcases}
      CompilerOptions__GccStandard: ${COMPILER__GCC_STANDARD:-c11}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    volumes:
      - pied-lms-backend-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      lms-postgres:
        condition: service_healthy
    networks:
      - pied-lms-network
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=api-backend"
      - "com.piedteam.description=ASP.NET Core API for PIED LMS"
      - "com.piedteam.version=${TAG:-latest}"
      - "com.piedteam.environment=${ENVIRONMENT:-production}"
      - "com.piedteam.port.internal=8080"
      - "com.piedteam.port.external=${API_PORT:-5000}"
      - "com.piedteam.healthcheck.endpoint=/health"
      - "com.piedteam.framework=dotnet"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  pied-lms-postgres-data:
    name: pied-lms-postgres-data
    driver: local
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=postgres-data"
      - "com.piedteam.description=PostgreSQL data volume"
      - "com.piedteam.backup.required=true"
  pied-lms-backend-storage:
    name: pied-lms-backend-storage
    driver: local
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=backend-storage"
      - "com.piedteam.description=Backend file storage for test cases"
  pied-lms-cloudflare-config:
    name: pied-lms-cloudflare-config
    driver: local
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=cloudflare-config"
      - "com.piedteam.description=Cloudflare tunnel configuration"

networks:
  pied-lms-network:
    name: pied-lms-network
    driver: bridge
    labels:
      - "com.piedteam.project=pied-lms"
      - "com.piedteam.service=internal-network"
      - "com.piedteam.description=Internal network for PIED LMS services"
