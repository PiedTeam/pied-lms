services:
    postgres:
        image: ${POSTGRES_IMAGE}
        container_name: ${POSTGRES_CONTAINER_NAME}
        restart: ${RESTART_POLICY}
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            default:
                aliases:
                    - ${POSTGRES_SERVICE_ALIAS}
                    - ${POSTGRES_CONTAINER_NAME}

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ${API_CONTAINER_NAME}
        restart: ${RESTART_POLICY}
        user: ${API_RUN_AS_USER}
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
            ASPNETCORE_URLS: ${ASPNETCORE_URLS}
            DATABASE__HOST: ${DATABASE_HOST}
            DATABASE__PORT: ${DATABASE_PORT}
            DATABASE__NAME: ${DATABASE_NAME}
            DATABASE__USER: ${DATABASE_USER}
            DATABASE__PASSWORD: ${DATABASE_PASSWORD}
            Compiler__ContainerImage: ${COMPILER_CONTAINER_IMAGE}
        ports:
            - "${API_PORT}:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - default

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        restart: unless-stopped
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        ports:
            - "9090:9090"
        networks:
            - default

    loki:
        image: grafana/loki:latest
        container_name: loki
        restart: unless-stopped
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/local-config.yaml
        networks:
            - default

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_SMTP_ENABLED=true
            - GF_SMTP_HOST=smtp.gmail.com:587
            - GF_SMTP_USER=nemnguyenhoang2907@gmail.com
            - GF_SMTP_PASSWORD=temv rspf xvuo tloa
            - GF_SMTP_FROM_ADDRESS=nemnguyenhoang2907@gmail.com
        ports:
            - "3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
            - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
            - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
        depends_on:
            - prometheus
            - loki
        networks:
            - default

    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        restart: unless-stopped
        ports:
            - "9100:9100"
        networks:
            - default

volumes:
    postgres_data:
    prometheus_data:
    grafana_data:
