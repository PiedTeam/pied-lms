name: Deploy Production Server
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        default: self-hosted
        type: string
      tag:
        required: false
        default: develop-latest
        type: string
      environment:
        required: false
        default: dev
        type: string
jobs:
  deploy-application:
    runs-on: ${{ inputs.run-on }}
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      DATABASE__NAME: ${{ secrets.DATABASE__NAME }}
      DATABASE__USER: ${{ secrets.DATABASE__USER }}
      DATABASE__PASSWORD: ${{ secrets.DATABASE__PASSWORD }}
      ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      JWT__ISSUER: ${{ secrets.JWT__ISSUER }}
      JWT__AUDIENCE: ${{ secrets.JWT__AUDIENCE }}
      JWT__SECRET: ${{ secrets.JWT__SECRET }}
      JWT__EXPIRY_MINUTES: ${{ secrets.JWT__EXPIRY_MINUTES }}
      JWT__REFRESH_TOKEN_EXPIRATION_DAYS: ${{ secrets.JWT__REFRESH_TOKEN_EXPIRATION_DAYS }}
      EMAIL__HOST: ${{ secrets.EMAIL__HOST }}
      EMAIL__PORT: ${{ secrets.EMAIL__PORT }}
      EMAIL__SENDER_EMAIL: ${{ secrets.EMAIL__SENDER_EMAIL }}
      EMAIL__SENDER_PASSWORD: ${{ secrets.EMAIL__SENDER_PASSWORD }}
      SEED__ADMIN_PASSWORD: ${{ secrets.SEED__ADMIN_PASSWORD }}
      SEED__TEACHER_PASSWORD: ${{ secrets.SEED__TEACHER_PASSWORD }}
      SEED__MENTOR_PASSWORD: ${{ secrets.SEED__MENTOR_PASSWORD }}
      LOGGING__LOGLEVEL__DEFAULT: ${{ secrets.LOGGING__LOGLEVEL__DEFAULT }}
      LOGGING__LOGLEVEL__MICROSOFTASPNETCORE: ${{ secrets.LOGGING__LOGLEVEL__MICROSOFTASPNETCORE }}
      COMPILER__ENABLED: ${{ secrets.COMPILER__ENABLED }}
      COMPILER__CONTAINER_POOL_SIZE: ${{ secrets.COMPILER__CONTAINER_POOL_SIZE }}
      COMPILER__MAX_CONCURRENT_COMPILATIONS: ${{ secrets.COMPILER__MAX_CONCURRENT_COMPILATIONS }}
      COMPILER__MAX_CONCURRENT_TEST_CASES: ${{ secrets.COMPILER__MAX_CONCURRENT_TEST_CASES }}
      COMPILER__SEMAPHORE_WAIT_TIMEOUT_MS: ${{ secrets.COMPILER__SEMAPHORE_WAIT_TIMEOUT_MS }}
      COMPILER__CONTAINER_NAME_PREFIX: ${{ secrets.COMPILER__CONTAINER_NAME_PREFIX }}
      COMPILER__CONTAINER_IMAGE: ${{ secrets.COMPILER__CONTAINER_IMAGE }}
      COMPILER__CONTAINER_WORK_DIR: ${{ secrets.COMPILER__CONTAINER_WORK_DIR }}
      COMPILER__CONTAINER_NETWORK: ${{ secrets.COMPILER__CONTAINER_NETWORK }}
      COMPILER__CONTAINER_CPU_LIMIT: ${{ secrets.COMPILER__CONTAINER_CPU_LIMIT }}
      COMPILER__CONTAINER_MEMORY_LIMIT_MB: ${{ secrets.COMPILER__CONTAINER_MEMORY_LIMIT_MB }}
      COMPILER__CONTAINER_MEMORY_SWAP_MB: ${{ secrets.COMPILER__CONTAINER_MEMORY_SWAP_MB }}
      COMPILER__CONTAINER_PIDS_LIMIT: ${{ secrets.COMPILER__CONTAINER_PIDS_LIMIT }}
      COMPILER__CONTAINER_READONLY_ROOTFS: ${{ secrets.COMPILER__CONTAINER_READONLY_ROOTFS }}
      COMPILER__CONTAINER_TMPFS_MOUNT: ${{ secrets.COMPILER__CONTAINER_TMPFS_MOUNT }}
      COMPILER__DEFAULT_TIME_LIMIT_MS: ${{ secrets.COMPILER__DEFAULT_TIME_LIMIT_MS }}
      COMPILER__DEFAULT_MEMORY_LIMIT_MB: ${{ secrets.COMPILER__DEFAULT_MEMORY_LIMIT_MB }}
      COMPILER__WORKDIR_CLEANUP_INTERVAL_SECONDS: ${{ secrets.COMPILER__WORKDIR_CLEANUP_INTERVAL_SECONDS }}
      COMPILER__WORKDIR_MAX_AGE_MINUTES: ${{ secrets.COMPILER__WORKDIR_MAX_AGE_MINUTES }}
      COMPILER__OUTPUT_LIMIT_BYTES: ${{ secrets.COMPILER__OUTPUT_LIMIT_BYTES }}
      COMPILER__STDERR_LIMIT_BYTES: ${{ secrets.COMPILER__STDERR_LIMIT_BYTES }}
      COMPILER__COMPILE_SUCCESS_MARKER: ${{ secrets.COMPILER__COMPILE_SUCCESS_MARKER }}
      COMPILER__TEST_CASE_BASE_PATH: ${{ secrets.COMPILER__TEST_CASE_BASE_PATH }}
      COMPILER__GCC_STANDARD: ${{ secrets.COMPILER__GCC_STANDARD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: |
          SHORT_SHA=$(echo ${{ inputs.tag }} | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "TAG=$SHORT_SHA" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      - name: Pull New Image From Registry
        run: docker compose -f infra/docker/prod/compose.yaml -p pied-lms --profile ${{ inputs.profile }} pull
      - name: Deploy New Image
        run: docker compose -f infra/docker/prod/compose.yaml -p pied-lms --profile ${{ inputs.profile }} up -d

      - name: Prune Old Image
        run: docker image prune -af